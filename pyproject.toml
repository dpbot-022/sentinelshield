[project]
name = "sentinelshield"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dhruv-pathak_gxol", email = "dhruv.pathak@gxo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sentinelshield = "sentinelshield:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
